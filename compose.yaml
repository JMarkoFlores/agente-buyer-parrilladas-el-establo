# ==============================================================================
# DOCKER COMPOSE — AGENTE INTELIGENTE MULTICANAL BUYER (PARRILLADAS EL ESTABLO)
# Arquitectura de 6 Servicios:
#   1. sqlserver: Microsoft SQL Server Express 2022 con BD buyer poblada
#   2. backend: API Flask WSGI ejecutada con Gunicorn
#   3. scheduler: Proceso independiente de sincronización Meta con APScheduler
#   4. frontend: React + TypeScript servido con Nginx y proxy inverso a Flask
#   5. cloudbeaver: Interfaz gráfica web para administración de SQL Server
#   6. landing: Landing Page estática Astro 7 + Tailwind CSS 4 con Nginx
# ==============================================================================

name: agente-buyer

services:
  # ----------------------------------------------------------------------------
  # 1. MOTOR DE BASE DE DATOS: MICROSOFT SQL SERVER 2022 EXPRESS
  # ----------------------------------------------------------------------------
  sqlserver:
    build:
      context: ./docker/sqlserver
      dockerfile: Dockerfile
    container_name: establo_sqlserver
    restart: unless-stopped
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: ${ACCEPT_EULA:-Y}
      MSSQL_PID: ${MSSQL_PID:-Express}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-EstabloBuyer2026!DbPass}
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD:-EstabloBuyer2026!DbPass}\" -C -Q \"SELECT 1 FROM buyer.dbo.plataforma;\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 25s
    networks:
      - establo_network

  # ----------------------------------------------------------------------------
  # 2. SERVIDOR DE APLICACIÓN: BACKEND FLASK CON WSGI GUNICORN
  # ----------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: establo_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      # Conexión SQL Server
      DB_SERVER: ${DB_SERVER:-sqlserver}
      DB_PORT: ${DB_PORT:-1433}
      DB_NAME: ${DB_NAME:-buyer}
      DB_USER: ${DB_USER:-buyer_app}
      DB_PASSWORD: ${DB_PASSWORD:-EstabloBuyer2026!DbPass}
      DB_TRUSTED_CONNECTION: ${DB_TRUSTED_CONNECTION:-false}
      DB_DRIVER: ${DB_DRIVER:-ODBC Driver 18 for SQL Server}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-true}
      
      # Entorno Flask
      FLASK_ENV: ${FLASK_ENV:-production}
      FLASK_PORT: ${FLASK_PORT:-5000}
      SECRET_KEY: ${SECRET_KEY:-establo-buyer-secret-production-key-2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-establo-buyer-secret-2026}

      # Meta Graph API
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v27.0}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_HTTP_TIMEOUT: ${META_HTTP_TIMEOUT:-20}
      META_IG_ACCOUNT_ID: ${META_IG_ACCOUNT_ID:-}
      META_IG_ACCESS_TOKEN: ${META_IG_ACCESS_TOKEN:-}
      META_IG_LOGIN_TYPE: ${META_IG_LOGIN_TYPE:-FACEBOOK_LOGIN}

      # Restricción: el backend HTTP NUNCA ejecuta el scheduler embebido
      META_SYNC_ENABLED: "false"
      META_SYNC_SCHEDULER_EMBEDDED: "false"
      SCHEDULER_STANDALONE: "true"

      # Agente de Respuestas Automáticas
      AUTO_REPLY_ENABLED: ${AUTO_REPLY_ENABLED:-true}
      AUTO_REPLY_DRY_RUN: ${AUTO_REPLY_DRY_RUN:-false}
      AUTO_REPLY_REQUIRE_REVIEW: ${AUTO_REPLY_REQUIRE_REVIEW:-false}
      AUTO_REPLY_FACEBOOK_ENABLED: ${AUTO_REPLY_FACEBOOK_ENABLED:-true}
      AUTO_REPLY_INSTAGRAM_ENABLED: ${AUTO_REPLY_INSTAGRAM_ENABLED:-true}
      AUTO_REPLY_FORM_URL: ${AUTO_REPLY_FORM_URL:-https://elestablo.giansmd.dev/registro/}
      AUTO_REPLY_INCLUDE_FORM_URL: ${AUTO_REPLY_INCLUDE_FORM_URL:-true}
      AUTO_REPLY_LANDING_URL: ${AUTO_REPLY_LANDING_URL:-https://elestablo.giansmd.dev/}
      AUTO_REPLY_MAX_PER_CYCLE: ${AUTO_REPLY_MAX_PER_CYCLE:-5}
      AUTO_REPLY_COOLDOWN_HOURS: ${AUTO_REPLY_COOLDOWN_HOURS:-24}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - establo_network

  # ----------------------------------------------------------------------------
  # 3. PLANIFICADOR DE AGENTES: WORKER STANDALONE APSCHEDULER
  # ----------------------------------------------------------------------------
  scheduler:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: ["python", "run_scheduler.py"]
    container_name: establo_scheduler
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
      backend:
        condition: service_healthy
    environment:
      # Conexión SQL Server
      DB_SERVER: ${DB_SERVER:-sqlserver}
      DB_PORT: ${DB_PORT:-1433}
      DB_NAME: ${DB_NAME:-buyer}
      DB_USER: ${DB_USER:-buyer_app}
      DB_PASSWORD: ${DB_PASSWORD:-EstabloBuyer2026!DbPass}
      DB_TRUSTED_CONNECTION: ${DB_TRUSTED_CONNECTION:-false}
      DB_DRIVER: ${DB_DRIVER:-ODBC Driver 18 for SQL Server}
      DB_TRUST_SERVER_CERTIFICATE: ${DB_TRUST_SERVER_CERTIFICATE:-true}
      
      # Entorno
      FLASK_ENV: ${FLASK_ENV:-production}
      SECRET_KEY: ${SECRET_KEY:-establo-buyer-secret-production-key-2026}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-admin-establo-buyer-secret-2026}

      # Meta Graph API
      META_GRAPH_VERSION: ${META_GRAPH_VERSION:-v27.0}
      META_APP_ID: ${META_APP_ID:-}
      META_APP_SECRET: ${META_APP_SECRET:-}
      META_PAGE_ID: ${META_PAGE_ID:-}
      META_PAGE_ACCESS_TOKEN: ${META_PAGE_ACCESS_TOKEN:-}
      META_VERIFY_TOKEN: ${META_VERIFY_TOKEN:-}
      META_HTTP_TIMEOUT: ${META_HTTP_TIMEOUT:-20}
      META_IG_ACCOUNT_ID: ${META_IG_ACCOUNT_ID:-}
      META_IG_ACCESS_TOKEN: ${META_IG_ACCESS_TOKEN:-}
      META_IG_LOGIN_TYPE: ${META_IG_LOGIN_TYPE:-FACEBOOK_LOGIN}

      # Scheduler Standalone
      META_SYNC_ENABLED: "true"
      META_SYNC_INTERVAL_MINUTES: ${META_SYNC_INTERVAL_MINUTES:-1}
      META_SYNC_SCHEDULER_EMBEDDED: "false"
      SCHEDULER_STANDALONE: "false"
      SCHEDULER_LOCK_TYPE: ${SCHEDULER_LOCK_TYPE:-sql_server}

      # Agente de Respuestas Automáticas
      AUTO_REPLY_ENABLED: ${AUTO_REPLY_ENABLED:-true}
      AUTO_REPLY_DRY_RUN: ${AUTO_REPLY_DRY_RUN:-false}
      AUTO_REPLY_REQUIRE_REVIEW: ${AUTO_REPLY_REQUIRE_REVIEW:-false}
      AUTO_REPLY_FACEBOOK_ENABLED: ${AUTO_REPLY_FACEBOOK_ENABLED:-true}
      AUTO_REPLY_INSTAGRAM_ENABLED: ${AUTO_REPLY_INSTAGRAM_ENABLED:-true}
      AUTO_REPLY_FORM_URL: ${AUTO_REPLY_FORM_URL:-https://elestablo.giansmd.dev/registro/}
      AUTO_REPLY_INCLUDE_FORM_URL: ${AUTO_REPLY_INCLUDE_FORM_URL:-true}
      AUTO_REPLY_LANDING_URL: ${AUTO_REPLY_LANDING_URL:-https://elestablo.giansmd.dev/}
      AUTO_REPLY_MAX_PER_CYCLE: ${AUTO_REPLY_MAX_PER_CYCLE:-5}
      AUTO_REPLY_COOLDOWN_HOURS: ${AUTO_REPLY_COOLDOWN_HOURS:-24}
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if any('run_scheduler.py' in open(f'/proc/{p}/cmdline', 'rb').read().decode(errors='ignore') for p in os.listdir('/proc') if p.isdigit()) else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - establo_network

  # ----------------------------------------------------------------------------
  # 4. FRONTEND WEB: REACT + TYPESCRIPT + NGINX PROXY
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: establo_frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - establo_network

  # ----------------------------------------------------------------------------
  # 5. GESTIÓN WEB DE BASE DE DATOS: CLOUDBEAVER COMMUNITY
  # ----------------------------------------------------------------------------
  cloudbeaver:
    build:
      context: ./docker/cloudbeaver
      dockerfile: Dockerfile
    container_name: establo_cloudbeaver
    restart: unless-stopped
    ports:
      - "8978:8978"
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      CLOUDBEAVER_APP_ANONYMOUS_ACCESS_ENABLED: "false"
      # Inyectada por el entrypoint en la conexion preconfigurada a SQL Server
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    healthcheck:
      test: ["CMD", "bash", "-c", "</dev/tcp/127.0.0.1/8978"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - establo_network

  # ----------------------------------------------------------------------------
  # 6. LANDING PAGE WEB: ASTRO + TAILWIND 4 + NGINX (PARRILLADAS EL ESTABLO)
  # ----------------------------------------------------------------------------
  landing:
    build:
      context: ./landing
      dockerfile: Dockerfile
    container_name: landing
    restart: unless-stopped
    ports:
      - "${LANDING_PORT:-4321}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://127.0.0.1:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - establo_network

# ==============================================================================
# REDES Y VOLÚMENES PERSISTENTES
# ==============================================================================
networks:
  establo_network:
    name: establo_network
    driver: bridge

volumes:
  sqlserver_data:
    name: establo_sqlserver_data
  cloudbeaver_data:
    name: establo_cloudbeaver_data
