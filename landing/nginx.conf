server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Evita perder el puerto del host en redirecciones relativas (ej: /registro -> /registro/)
    absolute_redirect off;

    # Compresion Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Soporte para rutas de Astro (paginas estaticas /registro/index.html, etc.)
    location / {
        try_files $uri $uri/ $uri/index.html /index.html =404;
    }

    # Cache de activos estaticos
    location ~* \.(?:css|js|woff2?|svg|ttf|otf|eot|ico|png|jpg|jpeg|gif|webp|pdf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Paginas de error
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
